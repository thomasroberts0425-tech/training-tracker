<title>Training Tracker — Phase 2</title>
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --line:#e0e3e8;
    --text:#1a1d23; --muted:#697086; --faint:#9aa1b2;
    --accent:#2f6df6; --accent-soft:#e5edff;
    --good:#12a150; --good-soft:#e3f6ec; --warn:#e5890a; --bad:#e5484d;
    --chip:#eef0f3; --chip-on:#2f6df6; --shadow:0 1px 3px rgba(18,22,31,.08),0 1px 2px rgba(18,22,31,.04);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --surface:#181b21; --surface-2:#1f232b; --line:#2a2f39;
      --text:#eef1f6; --muted:#9aa2b2; --faint:#6b7385;
      --accent:#5b8dff; --accent-soft:#1c2740;
      --good:#37d67a; --good-soft:#15301f; --warn:#f0a52a; --bad:#ff6b6f;
      --chip:#232833; --chip-on:#5b8dff; --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --surface:#181b21; --surface-2:#1f232b; --line:#2a2f39;
    --text:#eef1f6; --muted:#9aa2b2; --faint:#6b7385;
    --accent:#5b8dff; --accent-soft:#1c2740;
    --good:#37d67a; --good-soft:#15301f; --warn:#f0a52a; --bad:#ff6b6f;
    --chip:#232833; --chip-on:#5b8dff; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --line:#e0e3e8;
    --text:#1a1d23; --muted:#697086; --faint:#9aa1b2;
    --accent:#2f6df6; --accent-soft:#e5edff;
    --good:#12a150; --good-soft:#e3f6ec; --warn:#e5890a; --bad:#e5484d;
    --chip:#eef0f3; --chip-on:#2f6df6; --shadow:0 1px 3px rgba(18,22,31,.08),0 1px 2px rgba(18,22,31,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0}
  #app{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    max-width:660px; margin:0 auto; padding:0 0 92px; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  header.top{
    position:sticky; top:0; z-index:30; background:var(--bg);
    display:flex; align-items:center; gap:10px; padding:14px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{font-weight:700; font-size:17px; letter-spacing:-.2px}
  header.top .sub{font-size:12px; color:var(--muted); font-weight:500}
  header.top .spacer{flex:1}
  .iconbtn{
    width:38px;height:38px;border:1px solid var(--line);background:var(--surface);
    border-radius:11px;color:var(--text);font-size:16px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;box-shadow:var(--shadow)
  }
  .iconbtn:active{transform:scale(.94)}
  main{padding:14px 16px 0}
  h2.screen-title{font-size:22px;margin:6px 2px 14px;letter-spacing:-.4px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 4px;font-size:15px;letter-spacing:-.2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
  label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
  input,select,textarea{
    font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;padding:10px 11px;width:100%;outline:none
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  input[type=number]{-moz-appearance:textfield}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    background:var(--accent);color:#fff;border:none;border-radius:11px;padding:12px 16px;
    font-weight:650;font-size:15px;cursor:pointer;box-shadow:var(--shadow)
  }
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--accent);box-shadow:none;padding:8px 6px}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line);box-shadow:none}
  .btn.wide{width:100%}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);color:var(--text);
    border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
  .pill.main{background:var(--accent-soft);color:var(--accent)}
  .pill.goal{background:var(--good-soft);color:var(--good)}
  .pill.band{background:var(--surface-2);color:var(--muted)}
  .drill{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;padding:11px 12px}
  .drill.done{background:var(--good-soft)}
  .drow{display:flex;align-items:flex-start;gap:10px}
  .drow .dmeta{flex:1;min-width:0}
  .drow .dn{font-weight:650;font-size:14px;letter-spacing:-.2px}
  .drow .dc{font-size:12px;color:var(--faint);margin-top:2px}
  .drow .pill{white-space:nowrap;margin-top:1px}
  .dinputs{display:flex;gap:12px;margin-top:10px;padding-left:32px}
  .dinputs .mini{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.3px;width:96px}
  .dinputs .mini input{text-align:center;padding:9px 8px}
  .block-head{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px}
  .block-head .b{font-weight:800;font-size:13px;color:var(--accent);letter-spacing:.4px}
  .block-head .r{font-size:12px;color:var(--muted)}
  .ex{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:hidden}
  .ex > .exh{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;background:var(--surface)}
  .ex > .exh .nm{font-weight:650;font-size:14.5px;flex:1;letter-spacing:-.2px}
  .ex > .exh .tgt{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .ex .cue{font-size:12px;color:var(--faint);padding:0 12px 2px}
  .ex .hint{font-size:12px;color:var(--accent);font-weight:600;padding:1px 12px 3px}
  .ex .sets{padding:4px 12px 12px;display:none}
  .ex.open .sets{display:block}
  .ex.done .exh{background:var(--good-soft)}
  .setrow{display:grid;grid-template-columns:26px 1fr 1fr 1fr;gap:8px;align-items:center;margin:7px 0}
  .setrow.time{grid-template-columns:26px 1fr 1fr}
  .setrow.check{grid-template-columns:26px 1fr}
  .setrow .sn{font-size:12px;color:var(--faint);font-weight:700;text-align:center}
  .setrow input{padding:9px 8px;text-align:center}
  .setrow .lab{font-size:10px;color:var(--faint);text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .colhead{display:grid;grid-template-columns:26px 1fr 1fr 1fr;gap:8px;margin:2px 0 -2px}
  .colhead.time{grid-template-columns:26px 1fr 1fr}
  .check-lab{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  .empty .big{font-size:30px;margin-bottom:6px;opacity:.7}
  .progress-track{height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .progress-fill{height:100%;background:var(--good);border-radius:99px}
  .goalcard{display:flex;flex-direction:column;gap:9px}
  .goalcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .goalcard .now{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chartwrap{width:100%;overflow-x:auto}
  svg.chart{display:block;width:100%;height:auto;min-width:280px}
  svg.chart text{fill:var(--muted)}
  nav.tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;max-width:660px;margin:0 auto;background:var(--surface);
    border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))
  }
  nav.tabbar button{
    flex:1;background:none;border:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;border-radius:10px
  }
  nav.tabbar button .ic{font-size:20px;line-height:1}
  nav.tabbar button.on{color:var(--accent)}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
  .sheet-bg.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:660px;margin:0 auto;
    background:var(--surface);border-radius:18px 18px 0 0;border:1px solid var(--line);
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);
    transition:transform .22s ease}
  .sheet.show{transform:translateY(0)}
  .sheet h3{margin:2px 0 12px}
  .sheet .btn{width:100%;margin-bottom:9px}
  .toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
    background:#111418;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;
    z-index:60;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:88%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .kpi{display:flex;gap:10px;flex-wrap:wrap}
  .kpi .k{flex:1;min-width:96px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px}
  .kpi .k .v{font-size:20px;font-weight:750;letter-spacing:-.5px}
  .kpi .k .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  a.link{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-weight:600;font-size:12.5px;
    padding:7px 8px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
</style>

<div id="app">
  <header class="top">
    <div>
      <div class="brand">Training Tracker</div>
      <div class="sub" id="hdrsub">Phase 2 · July</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" title="Theme">◐</button>
    <button class="iconbtn" id="menuBtn" title="Data">⋯</button>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="log" class="on"><span class="ic">🏋️</span>Lift</button>
    <button data-tab="runs"><span class="ic">⏱️</span>Sprints</button>
    <button data-tab="progress"><span class="ic">📈</span>Progress</button>
    <button data-tab="goals"><span class="ic">🎯</span>Goals</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3>Weight units</h3>
  <div class="seg" id="unitSeg" style="margin-bottom:16px">
    <button data-unit="lb">Pounds (lb)</button>
    <button data-unit="kg">Kilograms (kg)</button>
  </div>
  <h3>Data</h3>
  <button class="btn sec" id="expData">⬇︎ Save data to vault (.json)</button>
  <button class="btn sec" id="expMd">⬇︎ Export readable log (.md)</button>
  <button class="btn sec" id="impBtn">⬆︎ Import data (.json)</button>
  <input type="file" id="impFile" accept=".json,application/json" style="display:none">
  <div class="divider"></div>
  <button class="btn danger" id="resetBtn">Erase all logged data</button>
  <div class="small muted" style="margin-top:12px;line-height:1.5">
    Your logs live in this browser. Save to your vault regularly — that file is also how you move
    data between phone and laptop (import it on the other device).
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- standalone mobile viewport (harmless inside the published artifact) ---------- */
if(!document.querySelector('meta[name=viewport]')){
  var mv=document.createElement('meta');mv.name='viewport';
  mv.content='width=device-width, initial-scale=1, viewport-fit=cover';
  (document.head||document.documentElement).appendChild(mv);
}

/* =========================================================================
   PROGRAM DEFINITION  (Phase 2 — July, "Jackson")
   Exercises repeat every week; only the set/rep scheme changes.
   log: 'full' weight+reps+rpe | 'reps' reps+rpe | 'time' seconds+rpe | 'check' done
   side:true  => targets are per-side ("ea").   w = per-week array of per-set targets.
   ========================================================================= */
var K=function(n,v){var a=[];for(var i=0;i<n;i++)a.push(String(v));return a;};
var P=function(){return Array.prototype.slice.call(arguments).map(String);};
var SAME=function(a){return{1:a,2:a,3:a,4:a,5:a};};
var DL4=function(v){return{1:K(4,v),2:K(4,v),3:K(4,v),4:K(4,v),5:K(3,v)};}; // 4 sets, deload→3

var PROGRAM={
  name:"Phase 2 — July (Jackson)",
  weeks:[1,2,3,4,5], deload:5,
  days:[
    {key:'MON', title:'Lower Body — Strength & Movement', blocks:[
      {name:'Superset 1', rest:'rest 1–2:00', ex:[
        {id:'front_squat', name:'BB Front Squat', log:'full',
          w:{1:P(8,6,5,4),2:P(8,6,5,4),3:P(6,5,4,3),4:P(5,4,3,2),5:P(5,4,3)}},
        {id:'sl_band_vj', name:'SL Band-Assisted Vertical Jump', log:'reps', side:true,
          cue:'Off rack, overhead reach', w:DL4('5-10')},
        {id:'hip_thrust_9090', name:'90-90 into Hip Thrust', log:'reps', side:true,
          cue:'Can step through', w:DL4('5-10')},
        {id:'ankle_circles', name:'SL Wall Ankle Circles', log:'check', cue:'10/10 each', w:SAME(K(1,'10/10'))},
      ]},
      {name:'Superset 2', rest:'rest 1–2:00', ex:[
        {id:'hex_bar_rdl', name:'Kickstand Hex Bar RDL', log:'full', side:true,
          w:{1:P(6,5,5,4),2:P(6,5,5,4),3:P(6,5,4,3),4:P(5,4,3,2),5:P(5,4,3)}},
        {id:'split_box_jump', name:'Split 180 Box Jump', log:'reps', side:true,
          cue:'In front & behind, landed switches in split', w:DL4('5-8')},
        {id:'banded_abduction', name:'¼-Squat Banded Leg Abduction', log:'reps', side:true,
          cue:'Standing, rear heel into wall', w:DL4('20')},
        {id:'itb_stretch', name:'ITB Stretch on High Box', log:'check', cue:':30 each', w:SAME(K(1,':30'))},
      ]},
      {name:'Superset 3', rest:'rest 1:00', ex:[
        {id:'hip_lift_iso', name:'SL DB/Plate Hip Lift — ISO hold', log:'time', side:true,
          cue:'10° bend, back on 6" box, leg on 12" box', w:SAME(P(':20-:30',':20-:30',':30'))},
        {id:'calf_raise_iso', name:'SL Seated Calf Raise + ISO', log:'reps', side:true,
          cue:'15 reps then :20 iso hold each', w:SAME(K(3,'15 + :20'))},
        {id:'side_copenhagen', name:'Side Copenhagen Hip Lift', log:'reps', side:true,
          cue:'Plate on bottom knee optional', w:SAME(K(3,'20'))},
        {id:'gorilla_crawl', name:'Gorilla Crawl — 4 way', log:'check', cue:'5–10 yds each way', w:SAME(K(3,'5-10 yd'))},
      ]},
    ]},

    {key:'TUE', title:'Upper Body — Power', blocks:[
      {name:'Superset 1', rest:'rest 2:00', ex:[
        {id:'db_snatch', name:'SA DB Snatch from Ground', log:'full', side:true,
          w:{1:P(4,3,2,1),2:P(4,3,2,1),3:P(3,3,2,1),4:P(3,2,1,1),5:P(3,2,1)}},
        {id:'mb_wall_pass', name:'MB SL Wall Pass — chest & OH', log:'reps', side:true,
          cue:'Each way, each leg', w:DL4('10')},
        {id:'tspine_release', name:'T-Spine / Lat Release', log:'check',
          cue:'Kneeling elbows on bench, dowel', w:DL4('20')},
        {id:'groin_rollout', name:'Double Groin Rollout / Sit-backs', log:'check', cue:'×10', w:SAME(K(1,'10'))},
      ]},
      {name:'Superset 2', rest:'rest 2:00', ex:[
        {id:'bench_throws', name:'Bench Press Throws', log:'full',
          cue:'Smith machine or partner catch',
          w:{1:P(8,7,6,5),2:P(8,7,6,5),3:P(7,6,5,4),4:P(6,5,4,3),5:P(6,5,4)}},
        {id:'db_row_speed', name:'SA Speed DB Row', log:'full', side:true,
          w:{1:P(8,7,6,5),2:P(8,7,6,5),3:P(7,6,5,4),4:P(6,5,4,3),5:P(6,5,4)}},
        {id:'mb_slams', name:'MB Slams / Stab Push', log:'reps', cue:'Into wall + open step', w:SAME(K(3,'10 / 5 ea'))},
        {id:'chest_stretch', name:'Chest Stretch + Wall Slides', log:'check', cue:':20 / ×20', w:SAME(K(1,':20'))},
      ]},
      {name:'Superset 3', rest:'rest 1:30', ex:[
        {id:'pullup_hops', name:'Pull-up Hops', log:'reps', cue:'Salmon ladder / peg board', w:SAME(K(3,'10'))},
        {id:'lateral_pushup_hops', name:'Lateral Push-up Hops', log:'reps', side:true, w:SAME(K(3,'5-6'))},
        {id:'cable_wood_chop', name:'Explosive 2-Way Cable Wood Chop', log:'reps',
          cue:'Hi-lo & horizontal', w:SAME(K(3,'5/5 ea way'))},
        {id:'kneeling_psoas', name:'Kneeling Psoas + Lat Stretch', log:'check', cue:':20 each', w:SAME(K(1,':20'))},
      ]},
    ]},

    {key:'THU', title:'Lower Body — Power & Speed', blocks:[
      {name:'Superset 1', rest:'rest 1:00–2:00', ex:[
        {id:'power_clean', name:'Power Clean from Ground', log:'full', cue:'Last set = bonus',
          w:{1:P(4,4,3,2,'1-2'),2:P(4,4,3,2,'1-2'),3:P(4,3,2,2,1),4:P(4,3,2,1,1),5:P(4,3,2,1)}},
        {id:'vertical_jumps', name:'Vertical Jumps (BONUS)', log:'reps',
          cue:'Jump pad / Vertec if possible', w:SAME(K(4,'3'))},
        {id:'trx_cossack', name:'TRX Side-to-Side Cossack Squats', log:'reps', cue:'20 (10 each)', w:SAME(K(1,'20'))},
      ]},
      {name:'Superset 2', rest:'rest 1:30', ex:[
        {id:'bb_step_up', name:'Explosive BB Step-Up', log:'full', side:true,
          cue:'8" box top-end power / 12-18" hip activation',
          w:{1:K(4,'5'),2:K(4,'5'),3:K(4,'4'),4:K(4,'3'),5:K(3,'3')}},
        {id:'banded_step_hop', name:'Banded SL Assisted Step-Up Hop', log:'reps', side:true, w:DL4('6-10')},
        {id:'sl_hip_lifts', name:'SL Hip Lifts', log:'reps', side:true, w:DL4('20')},
        {id:'quads_psoas_stretch', name:'Kneeling Quads & Psoas Stretch', log:'check', cue:':20–:30 each', w:SAME(K(1,':20-:30'))},
      ]},
      {name:'Superset 3', rest:'rest 1:30', ex:[
        {id:'split_iso_push', name:'Split ISO Push Squats into Bar', log:'reps',
          cue:'Smith, ¼ depth · 5 × :03 each', w:SAME(K(3,'5 × :03 ea'))},
        {id:'split_cycle_jumps', name:'Travelling Split-Cycle Jumps', log:'reps', side:true,
          cue:'Forward / lateral / choice', w:SAME(K(3,'5'))},
        {id:'kneeling_start', name:'Kneeling Start', log:'reps', cue:'Straight / side / diagonal', w:SAME(K(3,'1'))},
        {id:'hammy_stretch', name:'Big Band SL Hammy Stretch', log:'check', cue:':20–:30 each', w:SAME(K(1,':20-:30'))},
      ]},
    ]},

    {key:'FRI', title:'Upper Body — Pure Strength', blocks:[
      {name:'Superset 1', rest:'rest 1:30', ex:[
        {id:'bench_press', name:'Bench Press', log:'full',
          w:{1:P(10,8,6,5),2:P(10,8,6,5),3:P(8,6,5,4),4:P(6,5,4,3),5:P(6,5,4)}},
        {id:'wtd_chin_ups', name:"Weighted Chin-ups", log:'full',
          w:{1:P(10,8,6,5),2:P(10,8,6,5),3:P(8,6,5,4),4:P(6,5,4,3),5:P(6,5,4)}},

/* =========================== HELPERS =========================== */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return (n<10?'0':'')+n; }
function fmtDate(iso){ if(!iso) return ''; var p=iso.split('-'); var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mo[(+p[1])-1]+' '+(+p[2]); }
function fmtDateY(iso){ return fmtDate(iso)+" '"+iso.slice(2,4); }
// RPE-adjusted Epley: effort on a 1–10 scale implies reps-in-reserve (10 = all-out, 0 RIR).
// Estimating from (reps + RIR) makes sub-maximal sets estimate a higher, truer 1RM.
function e1rm(w,reps,rpe){ w=+w; reps=+reps; if(!w||!reps) return 0;
  var rir=(rpe!=null&&rpe!=='')? Math.max(0,Math.min(9,10-(+rpe))) : 0;
  var eff=reps+rir; if(eff<=1) return w; return w*(1+eff/30); }
function round1(n){ return Math.round(n*10)/10; }
/* weight units — canonical storage is ALWAYS lb; the toggle only changes display + entry */
var LB_PER_KG=2.2046226218;
function unit(){ return (state.settings&&state.settings.unit)||'lb'; }
function lbToDisp(lb){ lb=+lb||0; return unit()==='kg'? lb/LB_PER_KG : lb; }   // lb -> display-unit number
function dispToLb(v){ v=parseFloat(v); if(isNaN(v)) return NaN; return unit()==='kg'? v*LB_PER_KG : v; } // input -> lb
function fmtNum(n){ return String(Math.round((+n)*10)/10); }                    // 1 dp, no trailing .0
function fmtWt(lb){ return fmtNum(lbToDisp(lb)); }                              // display-unit string (no unit)
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2200); }

/* find a saved lift session for a given date+day (one session per day) */
function findSession(dateISO,day){ for(var i=0;i<state.liftLogs.length;i++){ var s=state.liftLogs[i];
  if(s.dateISO===dateISO&&s.day===day) return s; } return null; }
/* history of a given exercise across all sessions, chronological */
function exerciseHistory(exId){
  var out=[];
  state.liftLogs.forEach(function(s){
    var ent=(s.entries||[]).filter(function(e){return e.exId===exId;})[0];
    if(!ent) return;
    var topW=0, bestE=0, topReps=0, topRpe=null;
    (ent.sets||[]).forEach(function(st){
      var w=+st.weight||0, r=+st.reps||0;
      if(w>topW){topW=w; topReps=r; topRpe=(st.rpe!=null&&st.rpe!=='')?+st.rpe:null;}
      var e=e1rm(w,r,st.rpe); if(e>bestE) bestE=e;
    });
    if(topW>0||bestE>0) out.push({dateISO:s.dateISO, week:s.week, topW:topW, topReps:topReps, topRpe:topRpe, e1rm:bestE});
  });
  out.sort(function(a,b){return a.dateISO<b.dateISO?-1:1;});
  return out;
}
/* all timed efforts at a distance: manual quick-adds + timed sprint-workout drills */
function runsFor(dist){
  var out=[];
  state.runLogs.forEach(function(r){ if(+r.distYd===+dist)
    out.push({dateISO:r.dateISO, distYd:+dist, timeSec:+r.timeSec, notes:r.notes||'', id:r.id, src:'run'}); });
  (state.sprintLogs||[]).forEach(function(s){ (s.entries||[]).forEach(function(e){ var d=DRILL_BY_ID[e.drillId];
    if(d&&d.timed&&+d.dist===+dist&&e.timeSec!=null&&e.timeSec!=='')
      out.push({dateISO:s.dateISO, distYd:+dist, timeSec:+e.timeSec, notes:d.name, id:s.id, src:'sprint'}); }); });
  out.sort(function(a,b){return a.dateISO<b.dateISO?-1:1;});
  return out;
}
function bestRun(dist){ var rs=runsFor(dist); if(!rs.length) return null;
  return rs.reduce(function(m,r){return (+r.timeSec<m)?+r.timeSec:m;}, Infinity); }

/* autoregulation: most recent session for this lift BEFORE the given date */
function lastBefore(exId, dateISO){
  var h=exerciseHistory(exId).filter(function(x){return x.dateISO<dateISO && x.topW>0;});
  return h.length? h[h.length-1] : null;
}
function autoregHint(e, dateISO){
  if(e.log!=='full') return '';
  var last=lastBefore(e.id, dateISO); if(!last) return '';
  var txt='Last '+fmtDate(last.dateISO)+': '+fmtWt(last.topW)+'×'+(last.topReps||'?')+(last.topRpe?' @'+last.topRpe:'');
  var sug='';
  if(last.topRpe!=null){
    var big=(e.id==='front_squat'||e.id==='power_clean'||e.id==='bb_step_up');
    var kg=unit()==='kg';
    var easy=big?(kg?5:10):(kg?2.5:5), ok=kg?2.5:5;
    if(last.topRpe<=6) sug='felt easy → +'+easy+' '+unit();
    else if(last.topRpe<=8) sug='dialed in → repeat or +'+ok+' '+unit();
    else sug='grinder → hold weight';
  } else sug='log RPE to get a suggestion';
  return txt+' · '+sug;
}

function setHasData(e,s){

function setsMarkup(e, targets, draft){

        '</div>';

      rows+='<div class="setrow time" data-ex="'+e.id+'" data-set="'+i+'">'+
        '<span class="sn">'+(i+1)+'</span>'+
        '<input class="f-reps" inputmode="numeric" placeholder="'+esc(tgt)+'" value="'+(s.reps!=null?esc(s.reps):'')+'">'+

function collectDraft(){
  // read current DOM inputs into logCtx.draft
  var draft={};
  Array.prototype.forEach.call(document.querySelectorAll('.ex'),function(exEl){
    var exId=exEl.getAttribute('data-ex'); var e=EX_BY_ID[exId]; if(!e) return;
    var sets=[];
    if(e.log==='check'){
      var cb=exEl.querySelector('.f-done');
      sets.push({done: cb?cb.checked:false});
    } else {
      Array.prototype.forEach.call(exEl.querySelectorAll('.setrow'),function(r){
        var o={};
        var w=r.querySelector('.f-weight'), rp=r.querySelector('.f-reps'),
            sc=r.querySelector('.f-sec'), rpe=r.querySelector('.f-rpe');
        if(w&&w.value!==''){ var wl=dispToLb(w.value); if(!isNaN(wl)) o.weight=String(Math.round(wl*100)/100); }
        if(rp&&rp.value!=='') o.reps=rp.value.trim();
        if(sc&&sc.value!=='') o.sec=sc.value.trim();
        if(rpe&&rpe.value!==''){ var rv=+rpe.value; if(!isNaN(rv)) o.rpe=String(Math.max(1,Math.min(10,Math.round(rv)))); }
        sets.push(o);
      });
    }
    draft[exId]={sets:sets};
  });
  logCtx.draft=draft;
  var nt=document.getElementById('logNotes'); if(nt) logCtx.notes=nt.value;
}
function saveSession(){
  collectDraft();
  var entries=[];
  Object.keys(logCtx.draft).forEach(function(exId){
    var e=EX_BY_ID[exId]; if(!e) return;
    var sets=logCtx.draft[exId].sets.filter(function(s){return setHasData(e,s);});
    if(sets.length) entries.push({exId:exId, sets:sets});
  });
  // upsert
  var existing=findSession(logCtx.dateISO, logCtx.day);
  if(!entries.length){
    if(existing){ state.liftLogs=state.liftLogs.filter(function(s){return s!==existing;}); save(); toast('Empty session removed'); }
    else toast('Nothing logged yet');
    render(); return;
  }
  var rec=existing||{id:uid()};
  rec.dateISO=logCtx.dateISO; rec.day=logCtx.day; rec.week=logCtx.week;
  rec.entries=entries; rec.notes=logCtx.notes||'';
  if(!existing) state.liftLogs.push(rec);
  state.settings.lastWeek=logCtx.week; state.settings.lastDay=logCtx.day;
  save();
  toast('Session saved ✓');
  render();
}

    if(tm&&tm.value!==''){ var tv=parseFloat(tm.value); if(!isNaN(tv)&&tv>0) o.timeSec=round1000(tv); }
    draft[id]=o;
  });
  sprintCtx.draft=draft;
  var nt=document.getElementById('sprNotes'); if(nt) sprintCtx.notes=nt.value;
}

  var existing=findSprint(sprintCtx.dateISO, sprintCtx.workout);

function goalSnapshots(){
  var out=[];
  state.goals.speed.forEach(function(g){
    var best=bestRun(g.distYd);
    out.push({type:'speed', id:g.id, title:g.distYd+'-yard sprint', target:(+g.targetSec).toFixed(2)+'s',
      now: best!=null? best.toFixed(2)+'s':'—',
      pct: best!=null? speedPct(best, +g.targetSec):0,
      hit: best!=null && best<=+g.targetSec });
  });
  state.goals.strength.forEach(function(g){
    var h=exerciseHistory(g.exId);
    var cur=0; h.forEach(function(x){ var v=g.metric==='e1rm'?x.e1rm:x.topW; if(v>cur) cur=v; });
    var nm=(EX_BY_ID[g.exId]||{}).name||g.exId;
    out.push({type:'strength', id:g.id, title:nm+(g.metric==='e1rm'?' (1RM)':''),
      target:fmtWt(g.targetWeight)+' '+unit(), now: cur?fmtWt(cur)+' '+unit():'—',
      pct: cur? Math.min(100, Math.round(cur/(+g.targetWeight)*100)):0,
      hit: cur>=+g.targetWeight });
  });
  return out;
}
function speedPct(cur, target){
  // progress from a nominal baseline (target+25%) down to target
  var base=target*1.25;
  if(cur<=target) return 100;
  if(cur>=base) return 0;
  return Math.round((base-cur)/(base-target)*100);
}

/* =========================== CHART (inline SVG) =========================== */
function lineChart(o){
  var pts=o.points||[]; var W=Math.max(320, 60+pts.length*46); var H=190;
  var padL=40, padR=14, padT=16, padB=30;
  if(!pts.length) return '<div class="empty" style="padding:16px">No data yet</div>';
  var ys=pts.map(function(p){return p.y;});
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  if(o.goal){ minY=Math.min(minY,o.goal.y); maxY=Math.max(maxY,o.goal.y); }
  if(minY===maxY){ minY-=1; maxY+=1; }
  var span=maxY-minY; minY-=span*0.15; maxY+=span*0.15;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  function X(i){ return padL + (pts.length===1? plotW/2 : (i/(pts.length-1))*plotW); }
  function Y(v){ return padT + (1-(v-minY)/(maxY-minY))*plotH; }
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  // target zone shading
  if(o.goal){
    var gy=Y(o.goal.y);
    var zoneY = o.betterDir==='down'? gy : padT;
    var zoneH = o.betterDir==='down'? (padT+plotH-gy) : (gy-padT);
    if(zoneH>0) s+='<rect x="'+padL+'" y="'+zoneY+'" width="'+plotW+'" height="'+zoneH+'" fill="var(--good)" opacity="0.08"></rect>';
    s+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"></line>';
    s+='<text x="'+(W-padR)+'" y="'+(gy-5)+'" text-anchor="end" font-size="10" fill="var(--good)" font-weight="700">'+esc(o.goal.label)+'</text>';
  }
  // y axis min/max labels
  s+='<text x="4" y="'+(Y(maxY)+10)+'" font-size="10">'+o.fmtY(maxY)+(o.unit||'')+'</text>';
  s+='<text x="4" y="'+(Y(minY))+'" font-size="10">'+o.fmtY(minY)+(o.unit||'')+'</text>';
  // area fill under the line (the trend is the product — give it weight)
  var gid='g'+Math.random().toString(36).slice(2,8);
  var baseY=padT+plotH;
  var area=pts.map(function(p,i){return (i?'L':'M')+X(i)+' '+Y(p.y);}).join(' ')+' L'+X(pts.length-1)+' '+baseY+' L'+X(0)+' '+baseY+' Z';
  s+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0" stop-color="var(--accent)" stop-opacity="0.20"></stop>'+
     '<stop offset="1" stop-color="var(--accent)" stop-opacity="0"></stop></linearGradient></defs>';
  s+='<path d="'+area+'" fill="url(#'+gid+')" stroke="none"></path>';
  // line
  var dpath=pts.map(function(p,i){return (i?'L':'M')+X(i)+' '+Y(p.y);}).join(' ');
  s+='<path d="'+dpath+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>';
  // points + value labels + x labels (emphasize the latest)
  pts.forEach(function(p,i){
    var cx=X(i), cy=Y(p.y), last=(i===pts.length-1);
    if(last) s+='<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="var(--accent)" opacity="0.16"></circle>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(last?4.5:3.2)+'" fill="var(--accent)" stroke="var(--surface)" stroke-width="'+(last?2:1)+'"></circle>';
    if(pts.length<=8) s+='<text x="'+cx+'" y="'+(cy-9)+'" text-anchor="middle" font-size="9.5" fill="var(--text)" font-weight="700" style="font-variant-numeric:tabular-nums">'+o.fmtY(p.y)+'</text>';
    if(i===0||i===pts.length-1||pts.length<=6)
      s+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="9.5">'+esc(p.x)+'</text>';
  });
  s+='</svg>';
  return s;
}

function buildMarkdown(){
  var L=[]; L.push('# Training Log — '+PROGRAM.name); L.push('');
  L.push('_Exported '+fmtDateY(todayISO())+' from Training Tracker. Weights in '+unit()+'._'); L.push('');
  // goals
  var gs=goalSnapshots();
  if(gs.length){ L.push('## Goals'); L.push('');
    gs.forEach(function(g){ L.push('- **'+g.title+'** — '+g.now+' → '+g.target+' ('+(g.hit?'✓ hit':g.pct+'%')+')'); });
    L.push(''); }
  // timed sprints
  var anyT=RUN_DISTANCES.some(function(d){return runsFor(d).length;});
  if(anyT){ L.push('## Timed sprints'); L.push('');
    RUN_DISTANCES.forEach(function(d){ var rs=runsFor(d); if(!rs.length) return;
      L.push('### '+d+'-yard (best '+bestRun(d).toFixed(2)+'s)'); L.push('');
      L.push('| Date | Time (s) | Notes |'); L.push('|---|---|---|');
      rs.slice().reverse().forEach(function(r){ L.push('| '+fmtDateY(r.dateISO)+' | '+(+r.timeSec).toFixed(2)+' | '+(r.notes||'')+' |'); });
      L.push(''); }); }
  // sprint sessions
  if(state.sprintLogs&&state.sprintLogs.length){ L.push('## Sprint sessions'); L.push('');
    state.sprintLogs.slice().sort(function(a,b){return a.dateISO<b.dateISO?1:-1;}).forEach(function(s){
      var wk=sprintByKey(s.workout)||{name:s.workout};
      L.push('### '+fmtDateY(s.dateISO)+' · '+wk.name);
      (s.entries||[]).forEach(function(e){ var d=DRILL_BY_ID[e.drillId]||{name:e.drillId};
        var bits=[]; if(e.timeSec!=null&&e.timeSec!=='') bits.push((+e.timeSec).toFixed(2)+'s');
        if(e.rpe) bits.push('RPE '+e.rpe); if(e.done&&!bits.length) bits.push('✓');
        if(bits.length) L.push('- **'+d.name+'**: '+bits.join(' · ')); });
      if(s.notes) L.push('- _'+s.notes+'_'); L.push(''); }); }
  // lift sessions
  if(state.liftLogs.length){ L.push('## Lift sessions'); L.push('');
    state.liftLogs.slice().sort(function(a,b){return a.dateISO<b.dateISO?1:-1;}).forEach(function(s){
      L.push('### '+fmtDateY(s.dateISO)+' · '+s.day+' · Week '+s.week);
      (s.entries||[]).forEach(function(e){ var ex=EX_BY_ID[e.exId]||{name:e.exId};
        var parts=(e.sets||[]).map(function(st){
          if(st.weight!=null&&st.weight!=='') return fmtWt(st.weight)+'×'+(st.reps||'?')+(st.rpe?'@'+st.rpe:'');
          if(st.reps!=null&&st.reps!=='') return (st.reps)+(st.rpe?'@'+st.rpe:'');
          if(st.sec!=null&&st.sec!=='') return st.sec+'s'+(st.rpe?'@'+st.rpe:'');
          if(st.done) return '✓'; return '';
        }).filter(Boolean);
        if(parts.length) L.push('- **'+ex.name+'**: '+parts.join(', '));
      });
      if(s.notes) L.push('- _'+s.notes+'_');
      L.push('');
    }); }
  return L.join('\n');
}
function saveFile(filename, data, mime){
  if(window.claude && window.claude.downloads && typeof window.claude.downloads.save==='function'){
    try{ window.claude.downloads.save({filename:filename, data:data}).then(function(){ toast('Saved '+filename); })
      .catch(function(err){ if(err&&err.code==='user_rejected') toast('Save cancelled'); else blobDownload(filename,data,mime); }); return; }
    catch(e){ /* fall through */ }
  }
  blobDownload(filename, data, mime);
}
function blobDownload(filename, data, mime){
  try{ var b=new Blob([data],{type:mime||'text/plain'}); var u=URL.createObjectURL(b);
    var a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },200); toast('Exported '+filename);
  }catch(e){ toast('Export failed'); }
}
function importData(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{ var obj=JSON.parse(rd.result); var d=obj.data||obj;
      if(!d||(!d.liftLogs&&!d.runLogs&&!d.sprintLogs&&!d.goals)) throw 0;
      if(!confirm('Replace all current data with the imported file?')) return;
      state.liftLogs=d.liftLogs||[]; state.runLogs=d.runLogs||[]; state.sprintLogs=d.sprintLogs||[];
      state.goals=d.goals||{speed:[],strength:[]};
      state.goals.speed=state.goals.speed||[]; state.goals.strength=state.goals.strength||[];
      if(d.settings){ state.settings.lastWeek=d.settings.lastWeek||state.settings.lastWeek;
        state.settings.lastDay=d.settings.lastDay||state.settings.lastDay;
        state.settings.lastSprint=d.settings.lastSprint||state.settings.lastSprint;
        if(d.settings.unit) state.settings.unit=d.settings.unit; }
      save(); logCtx=null; toast('Data imported ✓'); closeSheet(); applyTheme(); render();
    }catch(e){ toast('Could not read that file'); }
  };
  rd.readAsText(file);
}

/* =========================== SHEET / THEME =========================== */
function openSheet(){ document.getElementById('sheetBg').classList.add('show'); document.getElementById('sheet').classList.add('show'); }
function closeSheet(){ document.getElementById('sheetBg').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); }
function applyTheme(){ var t=state.settings.theme; if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
function toggleTheme(){
  var cur=state.settings.theme;
  var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(!cur) cur=prefersDark?'dark':'light';
  state.settings.theme = cur==='dark'?'light':'dark';
  save(); applyTheme();
}

/* =========================== EVENT WIRING =========================== */
function wire(){
  // exercise expand/collapse — persist inputs before re-render
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'),function(el){
    el.addEventListener('click',function(){ collectDraft(); var id=el.getAttribute('data-toggle');
      logCtx.open[id]=!logCtx.open[id]; render(); });
  });
  bind('logDate','change',function(e){ collectDraft(); logCtx.dateISO=e.target.value; loadDraftFromSaved(); render(); });
  bind('logWeek','change',function(e){ collectDraft(); logCtx.week=+e.target.value; render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.daychip'),function(el){
    el.addEventListener('click',function(){ collectDraft(); logCtx.day=el.getAttribute('data-day'); loadDraftFromSaved(); render(); });
  });
  bind('saveSession','click',saveSession);
  bind('delSession','click',function(){ var ex=findSession(logCtx.dateISO,logCtx.day);
    if(ex&&confirm('Delete this session?')){ state.liftLogs=state.liftLogs.filter(function(s){return s!==ex;}); save(); loadDraftFromSaved(); toast('Deleted'); render(); } });

  // sprints & speed
  bind('sprDate','change',function(e){ collectSprint(); sprintCtx.dateISO=e.target.value; loadSprintFromSaved(); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.wkchip'),function(el){
    el.addEventListener('click',function(){ collectSprint(); sprintCtx.workout=el.getAttribute('data-wk'); loadSprintFromSaved(); render(); }); });
  bind('saveSprint','click',saveSprint);
  bind('delSprint','click',function(){ var ex=findSprint(sprintCtx.dateISO,sprintCtx.workout);
    if(ex&&confirm('Delete this sprint session?')){ state.sprintLogs=state.sprintLogs.filter(function(s){return s!==ex;}); save(); loadSprintFromSaved(); toast('Deleted'); render(); } });
  Array.prototype.forEach.call(document.querySelectorAll('.distchip'),function(el){
    el.addEventListener('click',function(){ collectSprint(); syncRunForm(); runForm.dist=+el.getAttribute('data-dist'); render(); }); });
  bind('addRun','click',addRun);
  Array.prototype.forEach.call(document.querySelectorAll('.delRun'),function(el){
    el.addEventListener('click',function(){ var id=el.getAttribute('data-id'); collectSprint();
      state.runLogs=state.runLogs.filter(function(r){return r.id!==id;}); save(); toast('Time removed'); render(); }); });

  // progress
  bind('progSel','change',function(e){ progSel=e.target.value; render(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-metric]'),function(el){
    el.addEventListener('click',function(){ progMetric=el.getAttribute('data-metric'); render(); }); });

  // goals
  Array.prototype.forEach.call(document.querySelectorAll('[data-goaltab]'),function(el){
    el.addEventListener('click',function(){ goalTab=el.getAttribute('data-goaltab'); render(); }); });
  bind('addSpeedGoal','click',function(){
    var d=+document.getElementById('gsDist').value, t=parseFloat(document.getElementById('gsTime').value);
    if(!t||t<=0){ toast('Enter a target time'); return; }
    state.goals.speed=state.goals.speed.filter(function(g){return +g.distYd!==d;}); // one per distance
    state.goals.speed.push({id:uid(), distYd:d, targetSec:round1000(t)}); save(); toast('Speed goal set ✓'); render(); });
  bind('addStrengthGoal','click',function(){
    var ex=document.getElementById('gtLift').value, w=parseFloat(document.getElementById('gtWeight').value),
        m=document.getElementById('gtMetric').value;
    if(!w||w<=0){ toast('Enter a target weight'); return; }
    state.goals.strength=state.goals.strength.filter(function(g){return !(g.exId===ex&&g.metric===m);});
    state.goals.strength.push({id:uid(), exId:ex, targetWeight:Math.round(unit()==='kg'? w*LB_PER_KG : w), metric:m}); save(); toast('Strength goal set ✓'); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.delGoal'),function(el){
    el.addEventListener('click',function(){ var t=el.getAttribute('data-type'), id=el.getAttribute('data-id');
      state.goals[t]=state.goals[t].filter(function(g){return g.id!==id;}); save(); toast('Goal removed'); render(); }); });
}
function syncRunForm(){ var t=document.getElementById('runTime'), n=document.getElementById('runNotes'), dt=document.getElementById('runDate');
  if(t) runForm.time=t.value; if(n) runForm.notes=n.value; if(dt) runForm.dateISO=dt.value; }
function bind(id,ev,fn){ var el=document.getElementById(id); if(el) el.addEventListener(ev,fn); }

/* header + sheet (bound once) */
document.getElementById('menuBtn').addEventListener('click',openSheet);
document.getElementById('sheetBg').addEventListener('click',closeSheet);
document.getElementById('themeBtn').addEventListener('click',toggleTheme);
document.getElementById('expData').addEventListener('click',function(){ saveFile('training-data.json', buildJSON(), 'application/json'); });
document.getElementById('expMd').addEventListener('click',function(){ saveFile('training-log.md', buildMarkdown(), 'text/markdown'); });
document.getElementById('impBtn').addEventListener('click',function(){ document.getElementById('impFile').click(); });
document.getElementById('impFile').addEventListener('change',function(e){ if(e.target.files&&e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
document.getElementById('resetBtn').addEventListener('click',function(){
  if(confirm('Erase ALL logged sessions, runs and goals? This cannot be undone.')){
    var theme=state.settings.theme, un=state.settings.unit; state=blankState(); state.settings.theme=theme; state.settings.unit=un; save(); logCtx=null; sprintCtx=null; syncUnitSeg(); closeSheet(); toast('All data erased'); render(); } });
Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'),function(b){
  b.addEventListener('click',function(){ go(b.getAttribute('data-tab')); }); });

Array.prototype.forEach.call(document.querySelectorAll('#unitSeg button'),function(b){
  b.addEventListener('click',function(){ state.settings.unit=b.getAttribute('data-unit'); save(); syncUnitSeg();
    toast('Weights shown in '+state.settings.unit); render(); }); });
function syncUnitSeg(){ Array.prototype.forEach.call(document.querySelectorAll('#unitSeg button'),function(b){
  b.classList.toggle('on', b.getAttribute('data-unit')===(state.settings.unit||'lb')); }); }

/* boot */
applyTheme();
syncUnitSeg();
go('log');
})();
</script>
