<title>Training Tracker</title>
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --line:#e0e3e8;
    --text:#1a1d23; --muted:#697086; --faint:#9aa1b2;
    --accent:#2f6df6; --accent-soft:#e5edff;
    --good:#12a150; --good-soft:#e3f6ec; --warn:#e5890a; --warn-soft:#fbf0dd; --bad:#e5484d;
    --chip:#eef0f3; --chip-on:#2f6df6; --shadow:0 1px 3px rgba(18,22,31,.08),0 1px 2px rgba(18,22,31,.04);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --surface:#181b21; --surface-2:#1f232b; --line:#2a2f39;
      --text:#eef1f6; --muted:#9aa2b2; --faint:#6b7385;
      --accent:#5b8dff; --accent-soft:#1c2740;
      --good:#37d67a; --good-soft:#15301f; --warn:#f0a52a; --warn-soft:#2e2412; --bad:#ff6b6f;
      --chip:#232833; --chip-on:#5b8dff; --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --surface:#181b21; --surface-2:#1f232b; --line:#2a2f39;
    --text:#eef1f6; --muted:#9aa2b2; --faint:#6b7385;
    --accent:#5b8dff; --accent-soft:#1c2740;
    --good:#37d67a; --good-soft:#15301f; --warn:#f0a52a; --warn-soft:#2e2412; --bad:#ff6b6f;
    --chip:#232833; --chip-on:#5b8dff; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0}
  #app{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    max-width:660px; margin:0 auto; padding:0 0 96px; position:relative;-webkit-font-smoothing:antialiased;
  }
  header.top{position:sticky; top:0; z-index:30; background:var(--bg);
    display:flex; align-items:center; gap:10px; padding:14px 16px 10px; border-bottom:1px solid var(--line);}
  header.top .brand{font-weight:700; font-size:17px; letter-spacing:-.2px}
  header.top .sub{font-size:12px; color:var(--muted); font-weight:600}
  header.top .spacer{flex:1}
  .iconbtn{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:11px;
    color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .iconbtn:active{transform:scale(.94)}
  main{padding:14px 16px 0}
  h2.screen-title{font-size:22px;margin:6px 2px 12px;letter-spacing:-.4px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 4px;font-size:15px;letter-spacing:-.2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
  label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
  input,select,textarea{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  input[type=number]{-moz-appearance:textfield}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:12px 16px;font-weight:650;font-size:15px;cursor:pointer;box-shadow:var(--shadow)}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
  .btn.good{background:var(--good)}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line);box-shadow:none}
  .btn.wide{width:100%}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .pill.main{background:var(--accent-soft);color:var(--accent)}
  .pill.band{background:var(--surface-2);color:var(--muted)}
  .block-head{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px}
  .block-head .b{font-weight:800;font-size:13px;color:var(--accent);letter-spacing:.3px}
  .block-head .r{font-size:12px;color:var(--muted)}
  .ex{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:hidden}
  .ex > .exh{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
  .ex > .exh .nm{font-weight:650;font-size:14.5px;flex:1;letter-spacing:-.2px}
  .ex > .exh .tgt{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .ex .cue{font-size:12px;color:var(--faint);padding:0 12px 2px}
  .ex .sets{padding:4px 12px 12px;display:none}
  .ex.open .sets{display:block}
  .ex.done{background:var(--good-soft)}
  .ex.done .exh .nm::after{content:" ✓";color:var(--good)}
  .setrow{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;align-items:center;margin:7px 0}
  .setrow .sn{font-size:12px;color:var(--faint);font-weight:700;text-align:center}
  .setrow input{padding:9px 8px;text-align:center}
  .colhead{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;margin:2px 0 -2px}
  .colhead .lab{font-size:10px;color:var(--faint);text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .rpe-row{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .rpe-row label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .rpe-row input{width:74px;text-align:center}
  .rpe-row .hint{font-size:11px;color:var(--faint)}
  .auxbox{display:flex;align-items:center;gap:11px;padding:11px 12px}
  .auxbox .meta{flex:1;min-width:0}
  .auxbox .nm{font-weight:600;font-size:14px}
  .auxbox .tg{font-size:12px;color:var(--faint);margin-top:2px}
  input[type=checkbox]{width:24px;height:24px;accent-color:var(--good);flex:none}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:14px}
  .empty .big{font-size:30px;margin-bottom:6px;opacity:.7}
  .progress-track{height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .progress-fill{height:100%;border-radius:99px}
  .goalcard{display:flex;flex-direction:column;gap:9px}
  .goalcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .goalcard .now{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chartwrap{width:100%;overflow-x:auto}
  svg.chart{display:block;width:100%;height:auto;min-width:280px}
  svg.chart text{fill:var(--muted)}
  .kpi{display:flex;gap:10px;flex-wrap:wrap}
  .kpi .k{flex:1;min-width:92px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px}
  .kpi .k .v{font-size:20px;font-weight:750;letter-spacing:-.5px}
  .kpi .k .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  a.link{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-weight:600;font-size:12.5px;padding:7px 8px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .note{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 12px;font-size:13px}
  .recovery{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--radius);padding:14px;margin-bottom:14px}
  .recovery h3{margin:0 0 2px;font-size:15px;color:var(--warn)}
  .recovery ul{margin:8px 0 0;padding-left:18px}
  .recovery li{margin:4px 0;font-size:13.5px;line-height:1.4}
  .recovery .sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .recovery .sub .t{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;flex:1;min-width:120px}
  .refuel{border:1px solid var(--good);background:var(--good-soft);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
  .refuel .macros{font-size:18px;font-weight:750;letter-spacing:-.3px}
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;max-width:660px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav.tabbar button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;border-radius:10px}
  nav.tabbar button .ic{font-size:20px;line-height:1}
  nav.tabbar button.on{color:var(--accent)}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
  .sheet-bg.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:660px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;border:1px solid var(--line);padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;max-height:88vh;overflow:auto}
  .sheet.show{transform:translateY(0)}
  .sheet h3{margin:2px 0 10px}
  .sheet .btn{width:100%;margin-bottom:9px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .modal h2{margin:0 0 4px;font-size:20px}
  .toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);background:#111418;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:70;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:88%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .saved-ind{font-size:12px;color:var(--good);font-weight:600}
</style>

<div id="app">
  <header class="top">
    <div>
      <div class="brand">Training Tracker</div>
      <div class="sub" id="hdrsub">—</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" title="Theme">◐</button>
    <button class="iconbtn" id="menuBtn" title="Menu">⋯</button>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="lift" class="on"><span class="ic">🏋️</span>Lift</button>
    <button data-tab="runs"><span class="ic">⏱️</span>Sprints</button>
    <button data-tab="progress"><span class="ic">📈</span>Progress</button>
    <button data-tab="goals"><span class="ic">🎯</span>Goals</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3>Program</h3>
  <div class="seg" id="progSeg" style="margin-bottom:16px"></div>
  <h3>Weight units</h3>
  <div class="seg" id="unitSeg" style="margin-bottom:16px">
    <button data-unit="lb">Pounds (lb)</button>
    <button data-unit="kg">Kilograms (kg)</button>
  </div>
  <h3>Bodyweight <span class="small faint">(for refuel targets)</span></h3>
  <div class="row" style="margin-bottom:16px"><input id="bwInput" inputmode="decimal" placeholder="e.g. 200" style="flex:1"><button class="btn sec" id="bwSave" style="width:auto">Save</button></div>
  <h3>Data</h3>
  <button class="btn sec" id="expData">⬇︎ Save data to vault (.json)</button>
  <button class="btn sec" id="expMd">⬇︎ Export readable log (.md)</button>
  <button class="btn sec" id="impBtn">⬆︎ Import data (.json)</button>
  <input type="file" id="impFile" accept=".json,application/json" style="display:none">
  <div class="divider"></div>
  <button class="btn danger" id="resetBtn">Erase all logged data</button>
  <div class="small muted" style="margin-top:12px;line-height:1.5">Logs autosave in this browser. Export to your vault to back up / move between devices.</div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

var K=function(n,v){var a=[];for(var i=0;i<n;i++)a.push(String(v));return a;};
function mn(id,name,w,opt){return Object.assign({id:id,name:name,kind:'main',w:w},opt||{});}
function ax(id,name,target,opt){return Object.assign({id:id,name:name,kind:'aux',target:target},opt||{});}

       mn('db_row_speed','SA Speed DB Row',{1:R(8,7,6,5),2:R(8,7,6,5),3:R(7,6,5,4),4:R(6,5,4,3),5:R(6,5,4)},{side:true}),
       ax('mb_slams','MB Slams / Stab Push','10 / 5 ea',{cue:'Into wall + open step'}),
       ax('chest_stretch','Chest Stretch + Wall Slides',':20 / ×20')]},
     {name:'Superset 3', rest:'rest 1:30', ex:[

function blankState(){ return {version:2, activeProgram:'june', liftLogs:[], runLogs:[], sprintLogs:[],

function loadState(){
  try{ var s=JSON.parse(localStorage.getItem(LS_KEY)); if(!s||typeof s!=='object') return blankState();
    s.liftLogs=s.liftLogs||[]; s.runLogs=s.runLogs||[]; s.sprintLogs=s.sprintLogs||[];
    s.goals=s.goals||{speed:[],strength:[]}; s.goals.speed=s.goals.speed||[]; s.goals.strength=s.goals.strength||[];

    d.lastDay=d.lastDay||'MON'; d.lastSprint=d.lastSprint||'WED'; d.unit=d.unit||'lb';
    if(d.theme===undefined) d.theme=null; if(d.bodyweightLb===undefined) d.bodyweightLb=null;
    if(s.recovery===undefined) s.recovery=null; if(s.refuel===undefined) s.refuel=null;
    // migrate legacy lift logs (v1: per-set rpe, no prog/finished)
    s.liftLogs.forEach(function(sess){

      if(sess.finished===undefined) sess.finished=true;
      (sess.entries||[]).forEach(function(e){
        if(e.sets && e.sets.length && e.rpe===undefined){
          var mx=null; e.sets.forEach(function(st){ if(st.rpe!=null&&st.rpe!==''){ var v=+st.rpe; if(mx==null||v>mx) mx=v; } });
          if(mx!=null) e.rpe=String(mx);
          e.sets=e.sets.map(function(st){ return {weight:st.weight, reps:st.reps}; });

/* ============================ HELPERS ============================ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return (n<10?'0':'')+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(iso){ if(!iso) return ''; var p=iso.split('-'); var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return mo[(+p[1])-1]+' '+(+p[2]); }
function fmtDateY(iso){ return fmtDate(iso)+" '"+iso.slice(2,4); }
function round1(n){ return Math.round(n*10)/10; }
function round5(n){ return Math.round(n/5)*5; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2200); }
/* units — canonical lb */
var LB_PER_KG=2.2046226218;
function unit(){ return (state.settings&&state.settings.unit)||'lb'; }
function lbToDisp(lb){ lb=+lb||0; return unit()==='kg'? lb/LB_PER_KG : lb; }
function dispToLb(v){ v=parseFloat(v); if(isNaN(v)) return NaN; return unit()==='kg'? v*LB_PER_KG : v; }
function fmtNum(n){ return String(Math.round((+n)*10)/10); }
function fmtWt(lb){ return fmtNum(lbToDisp(lb)); }
/* RPE-adjusted Epley 1RM (effort as reps-in-reserve) */
function e1rm(w,reps,rpe){ w=+w; reps=+reps; if(!w||!reps) return 0; var rir=(rpe!=null&&rpe!=='')?Math.max(0,Math.min(9,10-(+rpe))):0; var eff=reps+rir; if(eff<=1) return w; return w*(1+eff/30); }

function findSession(pk,dateISO,day){ for(var i=0;i<state.liftLogs.length;i++){ var s=state.liftLogs[i]; if(s.prog===pk&&s.dateISO===dateISO&&s.day===day) return s; } return null; }
function exerciseHistory(pk,exId){
  var out=[];
  state.liftLogs.forEach(function(s){ if(s.prog!==pk) return;
    var ent=(s.entries||[]).filter(function(e){return e.exId===exId;})[0]; if(!ent||!ent.sets) return;
    var topW=0,bestE=0,topReps=0,rpe=(ent.rpe!=null&&ent.rpe!=='')?+ent.rpe:null;
    ent.sets.forEach(function(st){ var w=+st.weight||0,r=+st.reps||0; if(w>topW){topW=w;topReps=r;} var e=e1rm(w,r,rpe); if(e>bestE)bestE=e; });
    if(topW>0||bestE>0) out.push({dateISO:s.dateISO,topW:topW,topReps:topReps,rpe:rpe,e1rm:bestE});
  });
  out.sort(function(a,b){return a.dateISO<b.dateISO?-1:1;});
  return out;
}
function lastBefore(pk,exId,dateISO){ var h=exerciseHistory(pk,exId).filter(function(x){return x.dateISO<dateISO&&x.topW>0;}); return h.length?h[h.length-1]:null; }
function autoregHint(e,dateISO){
  if(e.kind!=='main') return '';
  var last=lastBefore(progId(),e.id,dateISO); if(!last) return '';
  var txt='Last '+fmtDate(last.dateISO)+': '+fmtWt(last.topW)+'×'+(last.topReps||'?')+(last.rpe?' @'+last.rpe:'');
  var sug='';
  if(last.rpe!=null){ var kg=unit()==='kg'; var big=/squat|clean|rdl|deadlift|bench/i.test(e.name); var easy=big?(kg?5:10):(kg?2.5:5),ok=kg?2.5:5;
    if(last.rpe<=6) sug='felt easy → +'+easy+' '+unit(); else if(last.rpe<=8) sug='dialed in → repeat or +'+ok+' '+unit(); else sug='grinder → hold weight';
  } else sug='log RPE to get a suggestion';
  return txt+' · '+sug;
}
/* timed efforts: manual runs + timed sprint drills */
function runsFor(dist){ var out=[];
  state.runLogs.forEach(function(r){ if(+r.distYd===+dist) out.push({dateISO:r.dateISO,timeSec:+r.timeSec,notes:r.notes||'',id:r.id,src:'run'}); });
  state.sprintLogs.forEach(function(s){ var dd=DRILL_BY[s.prog]||{}; (s.entries||[]).forEach(function(e){ var d=dd[e.drillId];
    if(d&&d.timed&&+d.dist===+dist&&e.timeSec!=null&&e.timeSec!=='') out.push({dateISO:s.dateISO,timeSec:+e.timeSec,notes:d.name,id:s.id,src:'sprint'}); }); });
  out.sort(function(a,b){return a.dateISO<b.dateISO?-1:1;}); return out;
}
function bestRun(dist){ var rs=runsFor(dist); if(!rs.length) return null; return rs.reduce(function(m,r){return r.timeSec<m?r.timeSec:m;},Infinity); }

/* session hardness from main-lift RPEs */
function sessionHardness(sess){ var vals=[]; (sess.entries||[]).forEach(function(e){ var ex=exOf(sess.prog,e.exId); if(ex&&ex.kind==='main'&&e.rpe!=null&&e.rpe!=='') vals.push(+e.rpe); });
  if(!vals.length) return null; var avg=vals.reduce(function(a,b){return a+b;},0)/vals.length; var mx=Math.max.apply(null,vals);
  return {avg:round1(avg), max:mx, hard:(avg>=8||mx>=9)}; }

  } else {
    var lifts=mainLifts(pk);
    h+='<div class="card"><h3>New strength goal</h3><div class="small muted" style="margin-top:2px">'+esc(prog().name)+' main lifts</div><label class="fld" style="margin-top:10px">Lift<select id="gtLift">'+lifts.map(function(l){return '<option value="'+l.id+'">'+esc(l.name)+'</option>';}).join('')+'</select></label>'+
       '<div class="row" style="gap:10px;margin-top:10px"><label class="fld" style="flex:1">Target ('+unit()+')<input id="gtWeight" inputmode="decimal" placeholder="'+(unit()==='kg'?'e.g. 125':'e.g. 275')+'"></label><label class="fld" style="flex:1">Measure<select id="gtMetric"><option value="top">Top set</option><option value="e1rm">Est. 1RM</option></select></label></div><button class="btn wide" id="addStrengthGoal" style="margin-top:12px">Add strength goal</button></div>';
    var sgs=state.goals.strength.filter(function(g){return g.prog===pk;});
    if(!sgs.length) h+='<div class="empty"><div class="big">🏋️</div>No strength goals for this program yet.</div>';
    else sgs.forEach(function(g){ var s=goalSnapshots().filter(function(x){return x.id===g.id;})[0]; h+='<div class="card">'+goalRow(s)+'<button class="btn danger wide delGoal" data-type="strength" data-id="'+g.id+'">Remove</button></div>'; });
  }
  return h;
}

/* ============================ CHART ============================ */
function lineChart(o){ var pts=o.points||[], W=Math.max(320,60+pts.length*46), H=190, padL=40,padR=14,padT=16,padB=30;
  if(!pts.length) return '<div class="empty" style="padding:16px">No data yet</div>';
  var ys=pts.map(function(p){return p.y;}), minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  if(o.goal){ minY=Math.min(minY,o.goal.y); maxY=Math.max(maxY,o.goal.y); } if(minY===maxY){minY-=1;maxY+=1;}
  var span=maxY-minY; minY-=span*0.15; maxY+=span*0.15; var plotW=W-padL-padR, plotH=H-padT-padB;
  function X(i){ return padL+(pts.length===1?plotW/2:(i/(pts.length-1))*plotW); }
  function Y(v){ return padT+(1-(v-minY)/(maxY-minY))*plotH; }
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  if(o.goal){ var gy=Y(o.goal.y), zY=o.betterDir==='down'?gy:padT, zH=o.betterDir==='down'?(padT+plotH-gy):(gy-padT);
    if(zH>0) s+='<rect x="'+padL+'" y="'+zY+'" width="'+plotW+'" height="'+zH+'" fill="var(--good)" opacity="0.08"></rect>';
    s+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"></line><text x="'+(W-padR)+'" y="'+(gy-5)+'" text-anchor="end" font-size="10" fill="var(--good)" font-weight="700">'+esc(o.goal.label)+'</text>'; }
  s+='<text x="4" y="'+(Y(maxY)+10)+'" font-size="10">'+o.fmtY(maxY)+(o.unit||'')+'</text><text x="4" y="'+Y(minY)+'" font-size="10">'+o.fmtY(minY)+(o.unit||'')+'</text>';
  var gid='g'+Math.random().toString(36).slice(2,8), baseY=padT+plotH, area=pts.map(function(p,i){return (i?'L':'M')+X(i)+' '+Y(p.y);}).join(' ')+' L'+X(pts.length-1)+' '+baseY+' L'+X(0)+' '+baseY+' Z';
  s+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.20"></stop><stop offset="1" stop-color="var(--accent)" stop-opacity="0"></stop></linearGradient></defs><path d="'+area+'" fill="url(#'+gid+')"></path>';
  s+='<path d="'+pts.map(function(p,i){return (i?'L':'M')+X(i)+' '+Y(p.y);}).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>';
  pts.forEach(function(p,i){ var cx=X(i),cy=Y(p.y),last=(i===pts.length-1);
    if(last) s+='<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="var(--accent)" opacity="0.16"></circle>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(last?4.5:3.2)+'" fill="var(--accent)" stroke="var(--surface)" stroke-width="'+(last?2:1)+'"></circle>';
    if(pts.length<=8) s+='<text x="'+cx+'" y="'+(cy-9)+'" text-anchor="middle" font-size="9.5" fill="var(--text)" font-weight="700" style="font-variant-numeric:tabular-nums">'+o.fmtY(p.y)+'</text>';
    if(i===0||i===pts.length-1||pts.length<=6) s+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="9.5">'+esc(p.x)+'</text>';
  });
  return s+'</svg>';
}

/* ============================ EXPORT / IMPORT ============================ */
function buildJSON(){ return JSON.stringify({app:'training-tracker',version:2,exported:new Date().toISOString(),data:{liftLogs:state.liftLogs,runLogs:state.runLogs,sprintLogs:state.sprintLogs,goals:state.goals,recovery:state.recovery,refuel:state.refuel,settings:state.settings}},null,2); }
function buildMarkdown(){ var L=['# Training Log',''];L.push('_Exported '+fmtDateY(todayISO())+'. Weights in '+unit()+'._','');
  var gs=goalSnapshots(); if(gs.length){ L.push('## Goals ('+prog().name+')',''); gs.forEach(function(g){ L.push('- **'+g.title+'** — '+g.now+' → '+g.target+' ('+(g.hit?'✓ hit':g.pct+'%')+')'); }); L.push(''); }
  var anyT=RUN_DISTANCES.some(function(d){return runsFor(d).length;});
  if(anyT){ L.push('## Timed sprints',''); RUN_DISTANCES.forEach(function(d){ var rs=runsFor(d); if(!rs.length) return; L.push('### '+d+'-yard (best '+bestRun(d).toFixed(2)+'s)','','| Date | Time | Notes |','|---|---|---|'); rs.slice().reverse().forEach(function(r){ L.push('| '+fmtDateY(r.dateISO)+' | '+r.timeSec.toFixed(2)+' | '+(r.notes||'')+' |'); }); L.push(''); }); }
  if(state.liftLogs.length){ L.push('## Lift sessions',''); state.liftLogs.slice().sort(function(a,b){return a.dateISO<b.dateISO?1:-1;}).forEach(function(s){ var pm=PROGRAMS[s.prog]||{name:s.prog}; L.push('### '+fmtDateY(s.dateISO)+' · '+s.day+' · Wk '+(s.week||'?')+' · '+pm.name);
    (s.entries||[]).forEach(function(e){ var ex=exOf(s.prog,e.exId)||{name:e.exId}; if(e.done){ L.push('- '+ex.name+' ✓'); return; } var parts=(e.sets||[]).filter(function(st){return st.weight||st.reps;}).map(function(st){ return (st.weight!=null&&st.weight!==''?fmtWt(st.weight)+'×':'')+(st.reps||'?'); }); if(parts.length) L.push('- **'+ex.name+'**: '+parts.join(', ')+(e.rpe?' @RPE '+e.rpe:'')); });
    L.push(''); }); }
  return L.join('\n');
}
function saveFile(fn,data,mime){ if(window.claude&&window.claude.downloads&&typeof window.claude.downloads.save==='function'){ try{ window.claude.downloads.save({filename:fn,data:data}).then(function(){toast('Saved '+fn);}).catch(function(err){ if(err&&err.code==='user_rejected')toast('Save cancelled'); else blob(fn,data,mime); }); return; }catch(e){} } blob(fn,data,mime); }
function blob(fn,data,mime){ try{ var b=new Blob([data],{type:mime||'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a'); a.href=u;a.download=fn;document.body.appendChild(a);a.click(); setTimeout(function(){URL.revokeObjectURL(u);a.remove();},200); toast('Exported '+fn); }catch(e){ toast('Export failed'); } }
function importData(file){ var rd=new FileReader(); rd.onload=function(){ try{ var obj=JSON.parse(rd.result), d=obj.data||obj; if(!d||(!d.liftLogs&&!d.runLogs&&!d.sprintLogs&&!d.goals)) throw 0; if(!confirm('Replace all current data with the imported file?')) return;
  state.liftLogs=d.liftLogs||[]; state.runLogs=d.runLogs||[]; state.sprintLogs=d.sprintLogs||[]; state.goals=d.goals||{speed:[],strength:[]}; state.goals.speed=state.goals.speed||[]; state.goals.strength=state.goals.strength||[];
  if(d.recovery!==undefined) state.recovery=d.recovery; if(d.refuel!==undefined) state.refuel=d.refuel;
  if(d.settings){ Object.assign(state.settings,d.settings); }
  save(); state=loadState(); liftCtx=null; sprintCtx=null; toast('Data imported ✓'); closeSheet(); applyTheme(); render(); }catch(e){ toast('Could not read that file'); } }; rd.readAsText(file); }

/* ============================ SHEET / THEME / MODAL ============================ */
function openSheet(){ document.getElementById('bwInput').value=state.settings.bodyweightLb?fmtNum(lbToDisp(state.settings.bodyweightLb)):''; document.getElementById('sheetBg').classList.add('show'); document.getElementById('sheet').classList.add('show'); }
function closeSheet(){ document.getElementById('sheetBg').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); }
function openModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modalBg').classList.add('show'); var c=document.getElementById('modalClose'); if(c) c.addEventListener('click',closeModal); }
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
function applyTheme(){ var t=state.settings.theme; if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
function toggleTheme(){ var cur=state.settings.theme, pd=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches; if(!cur) cur=pd?'dark':'light'; state.settings.theme=cur==='dark'?'light':'dark'; save(); applyTheme(); }
function syncSegs(){ Array.prototype.forEach.call(document.querySelectorAll('#unitSeg button'),function(b){ b.classList.toggle('on',b.getAttribute('data-unit')===unit()); });
  var ps=document.getElementById('progSeg'); ps.innerHTML=Object.keys(PROGRAMS).map(function(pk){return '<button data-prog="'+pk+'"'+(pk===progId()?' class="on"':'')+'>'+esc(PROGRAMS[pk].sub)+'</button>';}).join(''); }

/* ============================ WIRING ============================ */
var saveTimer=null;
function debouncedAutosave(fn){ var si=document.getElementById('saveInd'); if(si) si.textContent='saving…'; clearTimeout(saveTimer); saveTimer=setTimeout(fn,400); }
function wire(){
  // lift toggles
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'),function(el){ el.addEventListener('click',function(){ autosaveLift(); var id=el.getAttribute('data-toggle'); liftCtx.open[id]=!liftCtx.open[id]; render(); }); });
  bind('liftDate','change',function(e){ autosaveLift(); liftCtx.dateISO=e.target.value; var s=currentSession(); if(s&&s.week) liftCtx.week=s.week; render(); });
  bind('liftWeek','change',function(e){ autosaveLift(); liftCtx.week=+e.target.value; render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.daychip'),function(el){ el.addEventListener('click',function(){ autosaveLift(); liftCtx.day=el.getAttribute('data-day'); state.settings.lastDay=liftCtx.day; save(); var s=currentSession(); if(s&&s.week) liftCtx.week=s.week; render(); }); });
  bind('finishBtn','click',finishWorkout);
  bind('clearSession','click',function(){ var s=currentSession(); if(s&&confirm('Clear this session?')){ state.liftLogs=state.liftLogs.filter(function(x){return x!==s;}); save(); toast('Cleared'); render(); } });
  Array.prototype.forEach.call(document.querySelectorAll('.dismissRecovery'),function(el){ el.addEventListener('click',function(){ if(state.recovery){ state.recovery.dismissed=true; save(); render(); } }); });
  Array.prototype.forEach.call(document.querySelectorAll('.dismissRefuel'),function(el){ el.addEventListener('click',function(){ if(state.refuel){ state.refuel.dismissed=true; save(); render(); } }); });
  bind('setBwLink','click',openSheet);
  // sprint
  bind('sprDate','change',function(e){ autosaveSprint(); sprintCtx.dateISO=e.target.value; render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.wkchip'),function(el){ el.addEventListener('click',function(){ autosaveSprint(); sprintCtx.workout=el.getAttribute('data-wk'); state.settings.lastSprint=sprintCtx.workout; save(); render(); }); });
  bind('finishSprint','click',function(){ autosaveSprint(); toast('Sprint session saved ✓'); render(); });
  bind('clearSprint','click',function(){ var s=findSprint(sprintCtx.dateISO,sprintCtx.workout); if(s&&confirm('Clear this session?')){ state.sprintLogs=state.sprintLogs.filter(function(x){return x!==s;}); save(); toast('Cleared'); render(); } });
  Array.prototype.forEach.call(document.querySelectorAll('.distchip'),function(el){ el.addEventListener('click',function(){ autosaveSprint(); syncRun(); runForm.dist=+el.getAttribute('data-dist'); render(); }); });
  bind('addRun','click',function(){ autosaveSprint(); var t=parseFloat(document.getElementById('runTime').value),dt=document.getElementById('runDate').value||todayISO(); if(!t||t<=0){ toast('Enter a valid time'); return; } state.runLogs.push({id:uid(),dateISO:dt,distYd:runForm.dist,timeSec:Math.round(t*1000)/1000,notes:''}); save(); runForm.time=''; toast('Time added ✓'); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.delRun'),function(el){ el.addEventListener('click',function(){ autosaveSprint(); var id=el.getAttribute('data-id'); state.runLogs=state.runLogs.filter(function(r){return r.id!==id;}); save(); toast('Removed'); render(); }); });
  // progress
  bind('progSel','change',function(e){ progSel=e.target.value; render(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-metric]'),function(el){ el.addEventListener('click',function(){ progMetric=el.getAttribute('data-metric'); render(); }); });
  Array.prototype.forEach.call(document.querySelectorAll('.openSession'),function(el){ el.addEventListener('click',function(){ ensureLift(); liftCtx.dateISO=el.getAttribute('data-date'); liftCtx.day=el.getAttribute('data-day'); liftCtx.week=+el.getAttribute('data-week')||1; go('lift'); }); });
  // goals
  Array.prototype.forEach.call(document.querySelectorAll('[data-goaltab]'),function(el){ el.addEventListener('click',function(){ goalTab=el.getAttribute('data-goaltab'); render(); }); });
  bind('addSpeedGoal','click',function(){ var d=+document.getElementById('gsDist').value,t=parseFloat(document.getElementById('gsTime').value); if(!t||t<=0){ toast('Enter a target'); return; } state.goals.speed=state.goals.speed.filter(function(g){return +g.distYd!==d;}); state.goals.speed.push({id:uid(),distYd:d,targetSec:Math.round(t*1000)/1000}); save(); toast('Speed goal set ✓'); render(); });
  bind('addStrengthGoal','click',function(){ var ex=document.getElementById('gtLift').value,w=parseFloat(document.getElementById('gtWeight').value),m=document.getElementById('gtMetric').value; if(!w||w<=0){ toast('Enter a target weight'); return; } state.goals.strength=state.goals.strength.filter(function(g){return !(g.prog===progId()&&g.exId===ex&&g.metric===m);}); state.goals.strength.push({id:uid(),prog:progId(),exId:ex,targetWeight:Math.round(unit()==='kg'?w*LB_PER_KG:w),metric:m}); save(); toast('Strength goal set ✓'); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.delGoal'),function(el){ el.addEventListener('click',function(){ var t=el.getAttribute('data-type'),id=el.getAttribute('data-id'); state.goals[t]=state.goals[t].filter(function(g){return g.id!==id;}); save(); toast('Removed'); render(); }); });
  // autosave: any input on lift/sprint screens
  var m=document.getElementById('main');
  m.oninput=function(ev){ if(current==='lift'&&ev.target.closest&&ev.target.closest('.ex')) debouncedAutosave(autosaveLift); else if(current==='runs'&&ev.target.closest&&ev.target.closest('[data-drill]')) debouncedAutosave(autosaveSprint); };
  m.onchange=function(ev){ if(ev.target.type==='checkbox'){ if(current==='lift') { autosaveLift(); render(); } else if(current==='runs'){ autosaveSprint(); render(); } } };
}
function syncRun(){ var t=document.getElementById('runTime'); if(t) runForm.time=t.value; var dt=document.getElementById('runDate'); if(dt) runForm.dateISO=dt.value; }
function bind(id,ev,fn){ var el=document.getElementById(id); if(el) el.addEventListener(ev,fn); }

/* one-time bindings */
document.getElementById('menuBtn').addEventListener('click',function(){ syncSegs(); openSheet(); });
document.getElementById('sheetBg').addEventListener('click',closeSheet);
document.getElementById('modalBg').addEventListener('click',function(e){ if(e.target.id==='modalBg') closeModal(); });
document.getElementById('themeBtn').addEventListener('click',toggleTheme);
document.getElementById('expData').addEventListener('click',function(){ saveFile('training-data.json',buildJSON(),'application/json'); });
document.getElementById('expMd').addEventListener('click',function(){ saveFile('training-log.md',buildMarkdown(),'text/markdown'); });
document.getElementById('impBtn').addEventListener('click',function(){ document.getElementById('impFile').click(); });
document.getElementById('impFile').addEventListener('change',function(e){ if(e.target.files&&e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
document.getElementById('bwSave').addEventListener('click',function(){ var v=parseFloat(document.getElementById('bwInput').value); if(!v||v<=0){ toast('Enter your bodyweight'); return; } state.settings.bodyweightLb=Math.round(dispToLb(v)); save(); toast('Bodyweight saved'); render(); });
document.getElementById('resetBtn').addEventListener('click',function(){ if(confirm('Erase ALL logged data? This cannot be undone.')){ var th=state.settings.theme,un=state.settings.unit,bw=state.settings.bodyweightLb,ap=state.settings.activeProgram; state=blankState(); state.settings.theme=th; state.settings.unit=un; state.settings.bodyweightLb=bw; state.settings.activeProgram=ap; save(); liftCtx=null; sprintCtx=null; closeSheet(); toast('All data erased'); render(); } });
Array.prototype.forEach.call(document.querySelectorAll('#unitSeg button'),function(b){ b.addEventListener('click',function(){ state.settings.unit=b.getAttribute('data-unit'); save(); syncSegs(); toast('Weights in '+state.settings.unit); render(); }); });
document.getElementById('progSeg').addEventListener('click',function(e){ var b=e.target.closest('[data-prog]'); if(!b) return; state.settings.activeProgram=b.getAttribute('data-prog'); save(); liftCtx=null; sprintCtx=null; progSel=null; syncSegs(); toast('Switched to '+prog().sub); render(); });
Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'),function(b){ b.addEventListener('click',function(){ if(current==='lift') autosaveLift(); else if(current==='runs') autosaveSprint(); go(b.getAttribute('data-tab')); }); });
/* flush pending edits the instant the app is backgrounded or closed (the data-loss fix) */
function flushAutosave(){ clearTimeout(saveTimer); if(current==='lift') autosaveLift(); else if(current==='runs') autosaveSprint(); }
window.addEventListener('pagehide',flushAutosave);
document.addEventListener('visibilitychange',function(){ if(document.hidden) flushAutosave(); });

/* boot */
applyTheme();
go('lift');
})();
</script>
